# OpenTelemetry Collector — base pipeline (always loaded).
# Receives OTLP from the mock production services and sends it to:
#   - ./data files (used by `npm run reconstruct`)
#   - Grafana Tempo (traces) and Prometheus (metrics), viewed in Grafana
# The Observe exporters are added by observe.yaml (OBSERVE_MODE=observe).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 2048
    send_batch_max_size: 4096
    timeout: 5s
  resource:
    attributes:
      - key: deployment.environment.name
        value: mock-production
        action: upsert
      - key: collector.name
        value: bpmn-iq-mockprod-collector
        action: upsert

exporters:
  file/traces:
    path: ${env:TELEMETRY_DATA_DIR:-/data}/traces.jsonl
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 5
  file/metrics:
    path: ${env:TELEMETRY_DATA_DIR:-/data}/metrics.jsonl
    rotation:
      max_megabytes: 50
      max_days: 7
      max_backups: 3
  debug:
    verbosity: basic
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/prometheus:
    # Prometheus' native OTLP receiver (--web.enable-otlp-receiver)
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [file/traces, debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [file/metrics, otlphttp/prometheus]
